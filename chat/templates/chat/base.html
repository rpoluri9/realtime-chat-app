<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Chat App{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #f5f7fa; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    header a { color: #1a73e8; text-decoration: none; margin-left: 12px; }
    .card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.12); margin-bottom: 16px; }
    button, input[type=submit] { background: #1a73e8; color: #fff; border: none; border-radius: 6px; padding: 10px 18px; cursor: pointer; font-size: 15px; }
    input[type=text], input[type=password], input[type=email] { width: 100%; padding: 10px; margin: 6px 0 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .error { color: #c5221f; } .info { color: #1a73e8; }
    #messages { height: 380px; overflow-y: auto; border: 1px solid #ddd; border-radius: 6px; padding: 12px; background: #fff; margin-bottom: 12px; }
    .msg { margin-bottom: 10px; } .msg .who { font-weight: bold; color: #1a73e8; }
    .msg .time { color: #888; font-size: 12px; margin-left: 8px; }
    #typing { color: #888; font-style: italic; min-height: 20px; }
    .row { display: flex; gap: 8px; } .row input[type=text] { flex: 1; margin: 0; }
  </style>
</head>
<body>
<header>
  <h1><a href="{% url 'room_list' %}" style="margin:0">💬 Chat App</a></h1>
  <nav>
    {% if user.is_authenticated %}
      <span>Hello, {{ user.username }}</span>
      <a href="{% url 'room_list' %}">Rooms</a>
      <a href="{% url 'logout' %}">Logout</a>
    {% else %}
      <a href="{% url 'login' %}">Login</a>
      <a href="{% url 'signup' %}">Sign up</a>
    {% endif %}
  </nav>
</header>
{% if messages %}
  {% for message in messages %}<p class="{% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</p>{% endfor %}
{% endif %}
{% block content %}{% endblock %}
</body>
</html>
